name: WM 2026 Kalender aktualisieren

# Laeuft taeglich um 03:00 UTC + manuell ausloesbar (Knopf auf GitHub)
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ICS generieren
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python wm2026_calendar.py

      - name: Aenderungen committen
        run: |
          git config user.name "wm2026-bot"
          git config user.email "bot@users.noreply.github.com"
          git add wm2026.ics
          git diff --staged --quiet || git commit -m "WM 2026 Kalender aktualisiert"
          git push
