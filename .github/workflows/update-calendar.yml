name: WM 2026 Kalender aktualisieren

# Laeuft alle 15 Minuten + manuell ausloesbar (Knopf auf GitHub).
# Hinweis: GitHubs Cron ist nicht minutengenau und kann bei hoher Last
# etwas spaeter laufen. Das ist normal und kein Fehler.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ICS generieren
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python wm2026_calendar.py

      - name: Aenderungen committen
        run: |
          git config user.name "wm2026-bot"
          git config user.email "bot@users.noreply.github.com"
          git add wm2026.ics
          git diff --staged --quiet || git commit -m "WM 2026 Kalender aktualisiert"
          git push
